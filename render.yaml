# Servidor WebSocket no Render (New → Blueprint). A raiz do repositório precisa conter as pastas server/ e shared/.
services:
  - type: web
    name: entrega-maluca-servidor
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
